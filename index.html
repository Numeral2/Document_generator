<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt Generator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Prompt Generator</h1>
        <form id="prompt-form">
            <label for="apiKey">OpenAI API Key:</label>
            <input type="password" id="apiKey" placeholder="Enter your API key (It won't be stored anywhere)" required>

            <label for="userInput">Enter Prompt:</label>
            <textarea id="userInput" placeholder="Enter your task description..." required></textarea>

            <label for="tokens">Max Tokens:</label>
            <input type="number" id="tokens" placeholder="70" value="70" required>

            <button type="submit">Generate</button>
        </form>

        <div id="draggable" class="output-container">
            <h2>Generated Prompt:</h2>
            <textarea id="response" class="output" readonly></textarea>
            <div class="actions">
                <button id="editButton">Edit</button>
                <button id="saveButton" style="display: none;">Save</button>
                <button id="copyButton">Copy</button>
                <button id="openChatGPT">Open in ChatGPT</button>
            </div>
        </div>

        <div class="email-collection">
            <h2>Stay Updated!</h2>
            <p>For new free stuff, leave your email, and we’ll notify you:</p>
            <form id="email-form">
                <label for="email">Email Address:</label>
                <input type="email" id="email" placeholder="Enter your email" required>
                <button type="submit">Submit</button>
                <p id="responseMessage" style="color: green;"></p>
            </form>
        </div>

        <p class="support">
            Support the Creator: <a href="https://twitter.com/numerosai" target="_blank">@numerosai</a>
        </p>
    </div>
    <script src="script.js"></script>
</body>
</html>
